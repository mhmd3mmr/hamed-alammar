    <script>
      // Apply saved language and theme before first paint to avoid a flash.
      (function () {
        try {
          var l = localStorage.getItem('ha-lang'), t = localStorage.getItem('ha-theme'), d = document.documentElement;
          if (l === 'ar') {
            d.lang = 'ar'; d.dir = 'rtl';
            ['reem-kufi-arabic-500', 'plex-arabic-400'].forEach(function (f) {
              var k = document.createElement('link'); k.rel = 'preload'; k.as = 'font'; k.type = 'font/woff2'; k.crossOrigin = '';
              k.href = '/fonts/' + f + '.woff2'; document.head.appendChild(k);
            });
          }
          if (t === 'dark' || t === 'light') d.dataset.theme = t;
        } catch (e) {}
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('rm');
      })();
    </script>
